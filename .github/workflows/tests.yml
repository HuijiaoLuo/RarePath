# Runs the unit and end-to-end tests, including the known-biology cluster check.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx
      - run: python -m unittest -v
      - run: python pipelines/check_cluster_benchmark.py
