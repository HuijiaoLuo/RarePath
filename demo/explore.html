    }

    // ================================================================= asking
    const chatState = { facts: [], history: [], ai: false, model: "", busy: false };
    function suggestionsFor() {
      const m = lastModel; if (!m) return [];
      const out = [];
      if (m.main[0]) out.push(`How is ${m.f.label} different from ${m.main[0].title}?`);
      out.push("What should we do first?", "Explain this in simple words");
      if (m.caution[0]) out.push(`Why be careful with ${m.caution[0].title}?`);
      return out.slice(0, 3);
    }
    function postAnswer(result, meta) {
      const used = (result.fact_ids || []).map(id => chatState.facts.find(f => f.id === id)).filter(Boolean);
      const follow = (result.follow_ups && result.follow_ups.length ? result.follow_ups : suggestionsFor()).slice(0, 3);
      postBot(`${renderAnswer(result.answer || "")}
        ${used.length ? `<div class="sources">${used.map(f => `<button type="button" data-fact="${f.id}"><b>${f.id.slice(1)}</b>${esc(f.title || f.text.slice(0, 70))}</button>`).join("")}</div>` : ""}
        ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
        <button type="button" class="ansfb" data-fb="answer_unsupported" data-fbk="answer" data-fbt="${esc(focusId || "")}" data-fbfacts="${esc((result.fact_ids || []).join(","))}" data-fbsrc="${result.source === "openai" ? "openai" : "offline"}">This answer says more than its sources</button>
        ${follow.length ? `<div class="chips quiet" style="margin-top:12px">${follow.map(q => `<button type="button" data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : ""}`);
    }
    async function ask(q) {
      if (!lastModel) { gapCard(q); return; }
      chatState.busy = true; $("#send").disabled = true;
      const wait = postBot(`<span class="typing" aria-label="Checking the sources"><i></i><i></i><i></i></span>`);
      let result = null, meta = "";
      if (chatState.ai) {
        try {
          const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 90000);
          const res = await fetch("api/chat", { method: "POST", signal: ctrl.signal, headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q, focus_id: focusId, focus_label: label(focusId), history: chatState.history.slice(-6),
              facts: chatState.facts.map(f => ({ id: f.id, text: f.text, refs: f.refs, computed: !!f.computed })) }) });
          clearTimeout(t);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.status);
          result = data; meta = `Answered by ${data.model}, using ${data.fact_ids.length} of RarePath's facts${data.graph_version ? ` (graph ${data.graph_version})` : ""}`;
          if (data.graph_version && graphVersion() && data.graph_version !== graphVersion()) meta += ". The server's graph differs from this page's, so reload to see the same data";
        } catch (err) { meta = "The AI could not answer just now, so this answer was put together from RarePath's facts directly"; }
      }
      if (!result) { result = offlineAnswer(q); if (!meta) meta = "Put together from RarePath's facts"; }
      wait.remove();
      postAnswer(result, meta);
      chatState.history.push({ role: "user", text: q }, { role: "assistant", text: result.answer });
      chatState.busy = false; $("#send").disabled = false;
    }
    // A question that names a disease the facts on screen do not cover would be answered
    // from the wrong disease's facts. Find such diseases, so the page can offer to switch first.
    function otherDiseasesIn(q) {
      if (!lastModel) return [];
      const n = ` ${norm(q)} `;
      const covered = ` ${norm([lastModel.f.label, ...chatState.facts.map(f => f.text)].join(" "))} `;
      const own = new Set([...lastModel.scope.members, ...lastModel.scope.parents, ...lastModel.scope.siblings]);
      const hits = new Map();
      for (const d of DATA.nodes) {
        if (d.kind !== "Disease" || own.has(d.id)) continue;
        const terms = (d.search || []).map(norm).filter(t => t && !/^(mondo|omim|orpha|ncbigene|gene symbol|doid|umls|mesh|icd)/.test(t))
          .flatMap(t => [t, t.replace(/\b(disease|syndrome|type|form|variant|deficiency)\b.*$/, "").trim(), ...(t.match(/\b[a-z]+\d\w*\b/g) || [])])
          .filter(t => (t.length >= 5 || (/\d/.test(t) && /[a-z]/.test(t) && t.length >= 3)) && n.includes(` ${t} `) && !covered.includes(` ${t} `));
        if (terms.length) { const t = terms.sort((x, y) => y.length - x.length)[0]; hits.set(d.id, t); }
      }
      // One button per disease named: drop a form when its parent also matched, and when several
      // diseases matched the same words ("tay sachs"), keep the one with the shortest name.
      const byTerm = new Map();
      for (const id of [...hits.keys()].filter(id => !parentsOf(id).some(p => hits.has(p)))) {
        const t = hits.get(id), seen = byTerm.get(t);
        if (!seen || label(id).length < label(seen).length) byTerm.set(t, id);
      }
      return [...byTerm.entries()].sort((a, b) => b[0].length - a[0].length).map(([, id]) => id).slice(0, 2);
    }
    function switchCard(q, ids) {
      postBot(`<p>Your question names <b>${esc(list(ids.map(label)))}</b>, but the facts RarePath has on screen are for <b>${esc(lastModel.f.label)}</b> and do not mention ${ids.length > 1 ? "them" : "it"}. An answer now would come from the wrong disease.</p>
        <div class="chips">${ids.map(id => `<button type="button" data-switchask="${esc(id)}" data-q="${esc(q)}">Switch to ${esc(label(id))} and ask</button>`).join("")}
        <button type="button" data-askhere="${esc(q)}">Answer about ${esc(lastModel.f.label)} anyway</button></div>`);
    }
    function handleInput(text) {
      const q = text.trim(); if (!q || chatState.busy) return;
      postMe(q);
      const isQuestion = /\?|^(what|why|how|who|which|when|where|can|could|should|is|are|do|does|tell|explain|help)\b/i.test(q);
      const hits = search(q);
      const top = hits[0];
      if (!isQuestion && top && q.split(/\s+/).length <= 6) {
        const strong = scoreNode(top, norm(q)) >= 58;
        if (strong && top.kind === "Disease") { selectDisease(top.id); return; }
        if (strong) { chooserCard(top); return; }
      }
      if (!lastModel || (!isQuestion && !hits.length && q.split(/\s+/).length <= 4)) { gapCard(q); return; }
      const other = otherDiseasesIn(q);
      if (other.length) { switchCard(q, other); return; }
      ask(q);
    }

    // ================================================================= header switcher
    let active = -1;
    function renderDropdown(text) {
      const dd = $("#dropdown");
      if (!text.trim()) { dd.hidden = true; $("#q").setAttribute("aria-expanded", "false"); return; }
      const hits = search(text); active = 0;
      dd.innerHTML = hits.length ? hits.map((n, i) => {
        const extra = n.kind === "Disease" ? genesOf([n.id]).join(", ") : `${diseasesFor(n).length} linked`;
        return `<li><button type="button" role="option" data-pick="${esc(n.id)}" class="${i === 0 ? "active" : ""}"><span>${esc(n.label)}</span><small>${esc(KIND_TEXT[n.kind] || n.kind)}${extra ? " · " + esc(extra) : ""}</small></button></li>`;
      }).join("") : `<li><button type="button" data-gap="${esc(text)}"><span>No match for “${esc(text)}”</span></button></li>`;
      dd.hidden = false; $("#q").setAttribute("aria-expanded", "true");
    }
    function pick(id) {
      $("#dropdown").hidden = true; $("#q").value = "";
      const n = N.get(id); if (!n) return;
      showGuide();
      if (n.kind === "Disease") selectDisease(id); else chooserCard(n);
    }

    // ================================================================= tabs
    function setTabs() { $("#tab-guide").setAttribute("aria-selected", String(view === "guide")); $("#tab-map").setAttribute("aria-selected", String(view === "map")); }
    function showGuide() { view = "guide"; setTabs(); $("#shell").hidden = false; $("#mapview").hidden = true; }
    function go(id) { selectDisease(id); }

    function buildFacts() {
      const m = lastModel; if (!m) return [];
      const facts = []; let i = 0;
      const add = (text, refs, extra) => {
        const r = [...new Set(refs.filter(Boolean))];
        if (!text || !r.length) return null;
        const fact = Object.assign({ id: "F" + (++i), text, refs: r }, extra || {});
        facts.push(fact); return fact;
      };
      const f = m.f;
      const geneEdges = m.scope.members.flatMap(id => edgesOf(id).filter(e => (e.type === "HAS_GENE" || e.type === "INVOLVES_GENE") && e.source === id).map(e => e.id));
      if (m.focusGenes.length) add(`${f.label} is caused by changes in the ${list(m.focusGenes)} ${m.focusGenes.length > 1 ? "genes" : "gene"}.`, geneEdges, { title: `${f.label}: cause` });
      if (m.formIds.length) {
        const isa = [...m.scope.members, ...m.formIds].flatMap(id => edgesOf(id).filter(e => e.type === "IS_A").map(e => e.id));
        add(`${f.label} ${m.scope.members.length > 1 ? "has these forms" : "is related to these forms"}: ${list(m.formIds.map(label))}.`, isa, { title: "Forms of the disease" });
      }
      const fam = familyOf(f);
      if (fam) {
        const peers = DATA.nodes.filter(n => n.kind === "Disease" && n.props && n.props.family === fam && !n.props.disease_group).length;
        add(`RarePath files ${f.label} under its ${fam} family (${peers} diseases in this snapshot). Diseases in one family are compared with each other first.`,
          [f.id], { title: `Disease family: ${fam}` });
      }
      if (m.signs.length) {
        const pe = m.scope.members.flatMap(id => edgesOf(id).filter(e => e.type === "HAS_PHENOTYPE" && m.signs.includes(label(e.target))).map(e => e.id));
        add(`The most distinctive signs recorded for ${f.label} in HPO are: ${list(m.signs.map(s => s.toLowerCase()))}.`, pe, { title: "Distinctive signs" });
      }
      // Names people actually type: "tay sachs", "sandhoff", "gaucher", "morquio", "gm2".
      const terms = ids => [...new Set(ids.flatMap(id => (N.get(id).search || []).map(norm))
        .filter(t => t && !/^(mondo|omim|orpha|gene symbol|ncbigene)/.test(t))
        .flatMap(t => [t, t.replace(/\b(disease|syndrome|type|form|variant|deficiency)\b.*$/, "").trim(), ...(t.match(/\b[a-z]+\d\w*\b/g) || [])]))]
        .filter(t => t.length >= 3 && !/^(type|disease|the|and)$/.test(t));
      for (const g of [...m.main.slice(0, 8), ...m.caution.slice(0, 5)]) {
        const { r, diff } = reasons(g, m.focusGenes);
        const members = g.memberIds.length > 1 ? ` (${g.memberIds.map(label).join(", ")})` : "";
        const care = g.tier === "caution" ? ` RarePath advises handling this one with care: ${cautionLine(g).toLowerCase()}.` : "";
        add(`RarePath rates the link between ${g.title}${members} and ${f.label} as "${TIER[g.tier].text.toLowerCase()}". ${[...r, ...diff].join(" ")}${care}`,
          [...g.edges, ...g.seedEdges].map(e => e.id), { group: g.key, title: g.title, computed: g.edges.length > 0, match: terms([...g.memberIds, g.key].filter(id => N.has(id))), caution: g.tier === "caution" });
      }
      for (const sid of m.studyIds) {
        const s = N.get(sid), st = s.study || {};
        const covers = edgesOf(sid).filter(e => STUDY_LINK.has(e.type));
        add(`${st.brief_title || s.label} (${s.external_id}) is ${st.study_type ? "an " + pretty(st.study_type) + " study" : "a study"}${st.lead_sponsor ? " run by " + st.lead_sponsor : ""} that includes ${list(covers.map(e => label(e.target)))}. Its status on ${(st.retrieved_at || "").slice(0, 10)} was "${pretty(st.overall_status || "unknown")}". Status and eligibility must be checked on the live ClinicalTrials.gov record.`,
          covers.map(e => e.id), { title: studyShort(sid), url: `https://clinicaltrials.gov/study/${s.external_id}`, study: true });
      }
      for (const o of [...m.yourOrgs, ...m.relatedOrgs]) {
        const sup = edgesOf(o).filter(e => e.type === "SUPPORTS");
        add(`${label(o)} is a patient organisation that supports families affected by ${list(sup.map(e => label(e.target)))}${m.yourOrgs.includes(o) ? ` (this is ${f.label}'s own community)` : ""}. Website: ${N.get(o).source_url || "not recorded"}.`,
          sup.map(e => e.id), { title: label(o), url: N.get(o).source_url, org: true });
      }
      const g = m.actionable[0];
      if (g) {
        const study = g.studies[0] ? N.get(g.studies[0]) : null;
        const theirOrg = g.orgs[0] ? label(g.orgs[0]) : "the study team";
        const yourOrg = m.yourOrgs[0] ? label(m.yourOrgs[0]) : "your patient group";
        const studyRefs = study ? edgesOf(study.id).filter(e => STUDY_LINK.has(e.type)).map(e => e.id) : [];
        add(`RarePath's suggested first step: ${theirOrg} and ${yourOrg} could compare outcome measures, registry fields and age ranges${study ? ` in ${(study.study || {}).brief_title || study.label} (${study.external_id})` : ""}. Before joining forces, an expert should check whether the study is still running, whether age ranges and eligibility overlap, that the causal genes differ (so sharing data does not mean sharing a treatment), and what data consent allows each group to share. A draft message is in step 4 of the guide.`,
          [...g.edges, ...g.seedEdges].map(e => e.id).concat(studyRefs), { title: "Suggested next step", computed: true, next: true });
      }
      return facts;
    }

    function suggestions() {
      const m = lastModel; if (!m) return [];
      const short = m.f.label;
      const out = [`Who is most like ${short}, and why?`];
      if (m.main[0]) out.push(`How is ${short} different from ${m.main[0].title}?`);
      out.push("What research already exists that we could use?", "What should we do first?");
      if (m.caution[0]) out.push(`Why be careful with ${m.caution[0].title}?`);
      out.push(`Explain ${short} in simple words`);
      return out.slice(0, 5);
    }

    function renderAnswer(text) {
      const safe = esc(text).replace(/\[(F\d+(?:\s*,\s*F\d+)*)\]/g, (_, ids) => ids.split(",").map(x => x.trim()).map(id => `<button class="cite" type="button" data-fact="${id}" aria-label="Source ${id.slice(1)}">${id.slice(1)}</button>`).join(""));
      return safe.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, "<br />")}</p>`).join("");
    }
    function offlineAnswer(q) {
      const n = norm(q), facts = chatState.facts, m = lastModel;
      const has = (...w) => w.some(x => n.includes(x));
      const pickF = pred => facts.filter(pred);
      const say = (lead, fs, tail) => ({ answer: [lead, ...fs.map(f => `${f.text} [${f.id}]`), tail].filter(Boolean).join("\n\n"), fact_ids: fs.map(f => f.id) });
      const gene = pickF(f => /is caused by changes/.test(f.text))[0];
      const next = pickF(f => f.next)[0];
      const groups = pickF(f => f.group && !f.caution);
      const careful = pickF(f => f.caution);
      // A disease name in the question counts only if it is not the disease being viewed ("Noonan" while on Noonan 1).
      const own = norm([m ? m.f.label : "", ...(m ? (m.f.search || []) : [])].join(" "));
      const named = pickF(f => f.group && (f.match || []).some(t => n.includes(t) && !own.includes(t)));
      const studies = pickF(f => f.study);
      if (has("join", "take part", "particip", "eligib", "enrol", "enroll", "qualif", "sign up")) {
        return say("RarePath cannot say whether someone can join a study. Eligibility depends on age, diagnosis and the study's current status, so check with the study team and the live ClinicalTrials.gov record, and with your doctor. What RarePath has on record:", studies.slice(0, 2));
      }
      if (has("treat", "cure", "drug", "therap", "medicine", "medication", "inhibitor", "dose", "should we start", "should we try", "same treatment")) {
        const lead = "RarePath cannot say whether a treatment will work or should be started. That is a decision for your doctors. A link between diseases is a reason to compare research, not evidence that a treatment transfers.";
        const lookalike = named.find(f => f.caution);
        if (lookalike) return say(lead + " Here the two diseases only look similar; their biology is different:", [lookalike]);
        return say(lead + " What the records do show:", named.length ? [gene, named[0]].filter(Boolean) : [gene, groups[0]].filter(Boolean));
      }
      // Whole words only: "cost" must not match "Costello", "die" must not match "studies".
      const word = (...ws) => ws.some(w => new RegExp(`\\b${w}\\b`).test(n));
      const scope = [["life expectancy", "prognosis", "survival", "how long will", "lifespan", "die", "dies"], ["how many people", "how many patients", "prevalence", "incidence", "how common", "how rare"],
        ["hospital", "hospitals", "clinic", "clinics", "doctor near", "best doctor", "specialist centre", "specialist center", "near me", "in beijing"], ["cost", "costs", "price", "insurance", "pay for"]];
      const topic = scope.findIndex(ws => word(...ws));
      if (topic >= 0) {
        const where = ["Natural-history studies and your care team are the right sources for prognosis.", "Orphanet and GARD publish prevalence estimates.",
          "Patient organisations usually know the specialist centres; RarePath lists them under Patient groups.", "Your care team or patient organisation can advise on costs and coverage."][topic];
        return say(`RarePath does not record ${["life expectancy or prognosis", "how many people have a disease", "hospitals or doctors", "costs or insurance"][topic]}, so it cannot answer that. ${where} What RarePath does have:`,
          [gene, topic === 2 ? pickF(f => f.org)[0] : studies[0]].filter(Boolean));
      }
      if (has("registry", "biorepository", "biobank", "natural history") && studies.length) return say("This is the existing work RarePath has on record:", studies.slice(0, 3));
      if (named.length) return say(`Here is what RarePath records about ${named.map(f => f.title).join(" and ")}:`, [...named.slice(0, 2), gene].filter(Boolean));
      if (has("careful", "caution", "look alike", "lookalike", "similar but", "trust", "not related")) return careful.length ? say("These look similar, but RarePath found little shared biology:", careful.slice(0, 3)) : say("RarePath has not flagged any look-alikes for this disease.", []);
      if (has("study", "studies", "trial", "registry", "research", "existing", "already", "data", "natural history", "group", "organi", "foundation", "community")) {
        const fs = [...pickF(f => f.study), ...pickF(f => f.org)].slice(0, 5);
        return fs.length ? say("This is the existing work RarePath has on record:", fs) : say("RarePath has no study, registry or patient group recorded for this disease yet. NORD, Global Genes and Orphanet are good places to look.", []);
      }
      if (has("next", "first", "start", "contact", "email", "plan", "what should", "what can we", "help")) return next ? say("A concrete step you could take this week:", [next]) : say("RarePath has no sourced partner to suggest yet. Step 4 of the guide lists how to find one.", []);
      if (has("sign", "symptom", "look like", "feature")) return say("", pickF(f => /distinctive signs/.test(f.text)).concat(gene ? [gene] : []));
      if (has("gene", "cause", "why does", "genetic")) return say("", [gene, pickF(f => /forms/.test(f.text))[0]].filter(Boolean));
      if (has("similar", "close", "share", "related", "who", "other famil", "like us", "neighbo")) return groups.length ? say("The closest communities RarePath found, strongest first:", groups.slice(0, 3)) : say("RarePath found no related community with sourced evidence yet.", []);
      return say(`Here is the short version for ${m ? m.f.label : "this disease"}:`, [gene, groups[0], next].filter(Boolean), "Ask me about a specific disease, the studies, or what to do next.");
    }

    function factDrawer(id) {
      const f = chatState.facts.find(x => x.id === id); if (!f) return;
      if (f.group) { groupDrawer(f.group); return; }
      const edges = f.refs.map(r => DATA.edges.find(e => e.id === r)).filter(Boolean);
      openDrawer(`Source ${id.slice(1)}`, f.title || "Fact", `<div class="dsec"><span class="tag ${f.computed ? "t-calc" : "t-db"}">${f.computed ? "Computed by RarePath" : "From a database"}</span><p style="margin-top:10px">${esc(f.text)}</p>
        ${f.url ? `<p><a href="${esc(f.url)}" target="_blank" rel="noopener">Open the original record ↗</a></p>` : ""}</div>
        <div class="dsec"><h3>Graph records behind this fact</h3><ul class="src">${edges.map(e => `<li><button class="btn" type="button" data-edge="${esc(e.id)}">${esc(label(e.source))} → ${esc(label(e.target))}</button></li>`).join("")}</ul></div>`);
    }

    // ================================================================= events
    document.addEventListener("click", ev => {
      if (ev.target.id === "copy") {
        const ta = $("#draft"), status = $("#copy-status");
        const fallback = () => { ta.focus(); ta.select(); status.textContent = "Text selected. Press Ctrl+C to copy."; };
        try { navigator.clipboard.writeText(ta.value).then(() => { status.textContent = "Copied. Paste it into your email."; }, fallback); } catch (_) { fallback(); }
        return;
      }
      if (ev.target.id === "open-map") { mapMode = "focus"; renderMap(); return; }
      const sw = ev.target.closest("[data-switchask],[data-askhere]");
      if (sw) {
        if (sw.dataset.switchask) { closeDrawer(); selectDisease(sw.dataset.switchask); }
        ask(sw.dataset.q || sw.dataset.askhere); return;
      }
      const fb = ev.target.closest("[data-fb]");
      if (fb) { sendFeedback(fb); return; }
      if (ev.target.closest("[data-forget]")) { forgetRecent(); return; }
      const t = ev.target.closest("[data-gene],[data-pick],[data-go],[data-group],[data-res],[data-gap],[data-mapmode],[data-ask],[data-fact],[data-edge],[data-more]");
      if (!t) { if (!ev.target.closest("#switch")) $("#dropdown").hidden = true; return; }
      if (t.dataset.gene) { geneDrawer(t.dataset.gene); return; }
      if (t.dataset.pick) pick(t.dataset.pick);
      else if (t.dataset.go) { $("#dropdown").hidden = true; closeDrawer(); selectDisease(t.dataset.go); }
      else if (t.dataset.group) groupDrawer(t.dataset.group);
      else if (t.dataset.res) resourceDrawer(t.dataset.res);
      else if (t.dataset.gap) { $("#dropdown").hidden = true; showGuide(); gapCard(t.dataset.gap); }
      else if (t.dataset.mapmode) { mapMode = t.dataset.mapmode; renderMap(); }
      else if (t.dataset.ask) { closeDrawer(); showGuide(); handleInput(t.dataset.ask); }
      else if (t.dataset.fact) factDrawer(t.dataset.fact);
      else if (t.dataset.edge) { const e = DATA.edges.find(x => x.id === t.dataset.edge); if (e) edgeDrawer(e); }
      else if (t.dataset.more) moreCard(t.dataset.more);
    });
    document.addEventListener("keydown", ev => {
      if (ev.key === "Escape") { closeDrawer(); $("#dropdown").hidden = true; }
      const g = ev.target.closest && ev.target.closest(".nodeg");
      if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); if (g.dataset.res) resourceDrawer(g.dataset.res); else groupDrawer(g.dataset.group); }
    });
    $("#q").addEventListener("input", ev => renderDropdown(ev.target.value));
    $("#q").addEventListener("keydown", ev => {
      const bs = [...document.querySelectorAll("#dropdown button")];
      if (!bs.length || (ev.key !== "ArrowDown" && ev.key !== "ArrowUp")) return;
      ev.preventDefault(); active = (active + (ev.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length;
      bs.forEach((b, i) => b.classList.toggle("active", i === active));
    });
    $("#switch").addEventListener("submit", ev => {
      ev.preventDefault();
      const v = $("#q").value.trim(); if (!v) return;
      renderDropdown(v);
      const bs = [...document.querySelectorAll("#dropdown button")];
      (bs[Math.max(0, active)] || bs[0]).click();
    });
    $("#ask-form").addEventListener("submit", ev => { ev.preventDefault(); const v = $("#ask").value; $("#ask").value = ""; $("#ask").style.height = ""; handleInput(v); });
    $("#ask").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("#ask-form").requestSubmit(); } });
    $("#ask").addEventListener("input", ev => { ev.target.style.height = "auto"; ev.target.style.height = Math.min(160, ev.target.scrollHeight) + "px"; });
    $("#drawer-close").addEventListener("click", closeDrawer);
    $("#backdrop").addEventListener("click", closeDrawer);
    $("#tab-guide").addEventListener("click", showGuide);
    $("#tab-map").addEventListener("click", () => { if (focusId) renderMap(); });

    // ================================================================= boot
    function boot() {
      index();
      hello();
      const params = new URLSearchParams(location.search);
      const f = params.get("focus"), q = params.get("q");
      const example = ["MONDO:0018149", "MONDO:0009261"].find(id => N.has(id)) || (DATA.nodes.find(n => n.kind === "Disease") || {}).id;
      if (f && N.has(f)) { N.get(f).kind === "Disease" ? selectDisease(f) : chooserCard(N.get(f)); }
      else if (q) handleInput(q);
      else if (readRecent()[0]) selectDisease(readRecent()[0]);
      else if (example) selectDisease(example, { example: true });
      if (params.get("view") === "map" && focusId) renderMap();
    }
    async function tryLive() {
      if (!/^https?:$/.test(location.protocol)) return;
      try {
        const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 4000);
        const res = await fetch("api/graph", { signal: ctrl.signal }); clearTimeout(t);
        if (res.ok) { const live = await res.json(); if (live && live.nodes && live.nodes.length >= (DATA.nodes || []).length) DATA = live; }
      } catch (_) { /* keep the exported snapshot */ }
    }
    async function checkChat() {
      if (!/^https?:$/.test(location.protocol)) return;
      try {
        const res = await fetch("api/health"); if (!res.ok) return;
        const h = await res.json();
        feedbackServer = !!h.feedback;
        if (h.chat) {
          chatState.ai = true; chatState.model = h.chat_model || "";
          $("#mode").textContent = `AI answers (${chatState.model})`;
          $("#privacy").textContent = "Your question goes to OpenAI through your own RarePath server. Please don't type names or medical details.";
        }
      } catch (_) { /* offline answers */ }
    }
    // Read-only hook for evals/capture_facts.py: the exact facts the page would send, and its offline answer.
    window.RAREPATH_EVAL = {
      facts(id) { selectDisease(id); return JSON.parse(JSON.stringify(chatState.facts)); },
      offline(id, q) {
        if (focusId !== id) selectDisease(id);
        const other = otherDiseasesIn(q);
        if (other.length) return { answer: `Switch first: the question names ${list(other.map(label))}, not ${label(id)}.`, fact_ids: [], switch_to: other.map(label) };
        return offlineAnswer(q);
      },
      graphVersion,
      other(id, q) { if (focusId !== id) selectDisease(id); return otherDiseasesIn(q).map(label); },
      suggest(id) { if (focusId !== id) selectDisease(id); return [...new Set([...suggestions(), ...suggestionsFor()])]; },
      diseases() { return DATA.nodes.filter(n => n.kind === "Disease").map(n => n.id); },
    };
    Promise.all([tryLive(), checkChat()]).then(boot);
  })();
  </script>
</body>
</html>
